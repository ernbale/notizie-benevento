# Pubblica il sito su GitHub Pages: a ogni modifica (notizie nuove) e ogni ora (meteo aggiornato).
name: Pubblica il sito

on:
  push:
    branches: [main]
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:
    inputs:
      facebook_subito:
        description: "Quante notizie mettere subito sulla Pagina Facebook (0 = come sempre, una ogni 25 minuti)"
        default: "0"
      telegram_subito:
        description: "Quante delle ultime notizie mandare subito sul canale Telegram (0 = come sempre)"
        default: "0"
      telegram_recupera:
        description: "Telegram: mandare subito tutte le notizie arretrate delle ultime 12 ore (1 = sì, 0 = come sempre)"
        default: "0"
      carburanti:
        description: "Prezzi dei carburanti (li manda il Pi di casa: carburanti.json compresso e in base64). Vuoto = quelli già pubblicati"
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # le statistiche leggono le pubblicazioni (puntualità dei giri)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # un passo piantato non deve tenere ferme per ore le pubblicazioni dopo (vanno una alla volta)
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Python con pip che funziona (quello di sistema di Ubuntu non lascia installare Pillow)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Meteo da 8 modelli
        env:
          # per leggere il bollettino della Protezione civile su GitHub senza finire nel limite delle richieste anonime
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ! python3 strumenti/meteo.py; then
            echo "Meteo non aggiornato: tengo quello già pubblicato"
            curl -fsSL --max-time 30 "https://notiziebenevento.it/meteo.json" -o meteo.json || echo "nessun meteo precedente"
          fi

      # il sito del Ministero da GitHub non si apre: i prezzi li scarica il Pi di casa (strumenti/carburanti.py --manda)
      # e li manda qui quando sono nuovi; nelle altre pubblicazioni restano quelli già sul sito
      - name: Prezzi dei carburanti (dal Pi di casa, o quelli già pubblicati)
        env:
          CARBURANTI: ${{ github.event.inputs.carburanti }}
        run: |
          if [ -n "$CARBURANTI" ] && printf '%s' "$CARBURANTI" | base64 -d | gunzip > carburanti.nuovo \
             && python3 -c "import json; d = json.load(open('carburanti.nuovo')); assert len(d['impianti']) > 60 and d['classifiche']['benzina'] and d['estrazione']; print('carburanti: arrivati dal Pi i prezzi del', d['estrazione'])"; then
            mv carburanti.nuovo carburanti.json
          else
            rm -f carburanti.nuovo
            curl -fsSL --max-time 30 "https://notiziebenevento.it/carburanti.json" -o carburanti.json || echo "nessun prezzo pubblicato prima"
          fi

      # le immagini di anteprima già fatte: si rifanno solo quelle delle notizie nuove o cambiate
      - uses: actions/cache@v4
        with:
          path: |
            img/n
            img/ig
          key: anteprime-${{ hashFiles('notizie.json', 'archivio/*.json', 'strumenti/pagine.py') }}
          restore-keys: anteprime-

      - name: Pagine per Google (una per notizia), sitemap, feed e anteprime
        run: |
          pip install --quiet pillow || echo "::warning::Pillow non installato: anteprime uguali per tutte"
          curl -fsSL --max-time 30 "https://notiziebenevento.it/sitemap.xml" -o "$RUNNER_TEMP/sitemap-prima.xml" || true
          if ! python3 strumenti/pagine.py --sitemap-prima "$RUNNER_TEMP/sitemap-prima.xml" --indexnow "$RUNNER_TEMP/indexnow.json"; then
            echo "::warning::Pagine non generate: il sito funziona lo stesso (404.html apre le notizie nella prima pagina)"
          fi

      # Telegram e le chiusure: cosa è già uscito lo ricorda un file che GitHub conserva tra una pubblicazione e
      # l'altra (cache; le pubblicazioni vanno una alla volta, vedi «concurrency» in alto). Si ripristina qui, prima
      # delle statistiche, che ne mostrano le chiusure uscite sui social.
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/social
          key: social-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: social-

      - name: Statistiche private (cifrate con la parola d'ordine)
        env:
          CHIUSURE_STATO: ${{ runner.temp }}/social/chiusure.json
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STATISTICHE_PAROLA: ${{ secrets.STATISTICHE_PAROLA }}
          GSC_CHIAVE: ${{ secrets.GSC_CHIAVE }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          DIARIO_CHIAVE: ${{ secrets.DIARIO_CHIAVE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install --quiet cryptography || echo "::warning::cryptography non installato"
          if ! python3 strumenti/statistiche.py; then
            echo "::warning::Statistiche non aggiornate (il sito si pubblica lo stesso)"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Avvisa Bing delle pagine nuove (IndexNow)
        run: |
          if [ -f "$RUNNER_TEMP/indexnow.json" ]; then
            python3 strumenti/pagine.py --invia-indexnow "$RUNNER_TEMP/indexnow.json" || echo "::warning::IndexNow non ha risposto"
          fi

      # le chiusure dei Comuni per prime e a qualsiasi ora, su Telegram (col suono), Facebook e Instagram
      # (strumenti/chiusure_social.py). Se un canale non va, il resto della pubblicazione continua, ma alla fine il
      # lavoro diventa rosso (mail al proprietario) e la sentinella rilancia la pubblicazione.
      - name: Chiusure dei Comuni sui social (a qualsiasi ora)
        id: chiusure
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/social"
          python3 strumenti/chiusure_social.py --stato "$RUNNER_TEMP/social/chiusure.json"

      # la curiosità del Sannio del giorno, alle 12 (alle 12 la pubblicazione la fa partire il Pi di casa), su Telegram,
      # Facebook e Instagram (strumenti/curiosita_social.py): dopo la pubblicazione, così foto e pagina sono già online.
      # Se un canale non va, il resto continua, ma alla fine il lavoro diventa rosso e la pubblicazione dopo riprova.
      - name: Curiosità del Sannio (alle 12, su Telegram, Facebook e Instagram)
        id: curiosita
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/social"
          python3 strumenti/curiosita_social.py --stato "$RUNNER_TEMP/social/curiosita.json"

      # dopo la pubblicazione, così Facebook trova già online la pagina della notizia (titolo e anteprima)
      - name: Facebook (una notizia nuova sulla Pagina, se è il momento)
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_SUBITO: ${{ github.event.inputs.facebook_subito || '0' }}
        run: python3 strumenti/facebook.py --stato "$RUNNER_TEMP/social/facebook.json" || echo "::warning::Facebook non ha pubblicato (vedi l'avviso sopra)"

      - name: Instagram (una notizia ogni 25 minuti e il riepilogo della sera, se è il momento)
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python3 strumenti/instagram.py || echo "::warning::Instagram non ha pubblicato (vedi l'avviso sopra)"

      - name: Telegram (notizie nuove e aggiornamenti sul canale)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_SUBITO: ${{ github.event.inputs.telegram_subito || '0' }}
          TG_RECUPERA: ${{ github.event.inputs.telegram_recupera || '0' }}
        run: |
          mkdir -p "$RUNNER_TEMP/social"
          python3 strumenti/telegram.py --stato "$RUNNER_TEMP/social/telegram.json" || echo "::warning::Telegram non ha pubblicato (vedi l'avviso sopra)"

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ runner.temp }}/social
          key: social-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Chiusure non uscite su tutti i canali (lavoro in rosso, mail al proprietario)
        if: steps.chiusure.outcome == 'failure'
        run: |
          echo "::error::Le chiusure dei Comuni non sono uscite su tutti i canali: vedi il passo «Chiusure dei Comuni sui social». La prossima pubblicazione riprova da sola."
          exit 1

      - name: Curiosità non uscita su tutti i canali (lavoro in rosso, mail al proprietario)
        if: steps.curiosita.outcome == 'failure'
        run: |
          echo "::error::La curiosità del Sannio non è uscita su tutti i canali: vedi il passo «Curiosità del Sannio». La prossima pubblicazione riprova da sola (fino alle 22)."
          exit 1
