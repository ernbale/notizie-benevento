# Pubblica il sito su GitHub Pages: a ogni modifica (notizie nuove) e ogni ora (meteo aggiornato).
name: Pubblica il sito

on:
  push:
    branches: [main]
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:
    inputs:
      facebook_subito:
        description: "Quante notizie mettere subito sulla Pagina Facebook (0 = come sempre, una all'ora)"
        default: "0"
      telegram_subito:
        description: "Quante delle ultime notizie mandare subito sul canale Telegram (0 = come sempre)"
        default: "0"
      telegram_recupera:
        description: "Telegram: mandare subito tutte le notizie arretrate delle ultime 12 ore (1 = sì, 0 = come sempre)"
        default: "0"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # un passo piantato non deve tenere ferme per ore le pubblicazioni dopo (vanno una alla volta)
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Python con pip che funziona (quello di sistema di Ubuntu non lascia installare Pillow)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Meteo da 8 modelli
        env:
          # per leggere il bollettino della Protezione civile su GitHub senza finire nel limite delle richieste anonime
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ! python3 strumenti/meteo.py; then
            echo "Meteo non aggiornato: tengo quello già pubblicato"
            curl -fsSL --max-time 30 "https://notiziebenevento.it/meteo.json" -o meteo.json || echo "nessun meteo precedente"
          fi

      # le immagini di anteprima già fatte: si rifanno solo quelle delle notizie nuove o cambiate
      - uses: actions/cache@v4
        with:
          path: |
            img/n
            img/ig
          key: anteprime-${{ hashFiles('notizie.json', 'archivio/*.json', 'strumenti/pagine.py') }}
          restore-keys: anteprime-

      - name: Pagine per Google (una per notizia), sitemap, feed e anteprime
        run: |
          pip install --quiet pillow || echo "::warning::Pillow non installato: anteprime uguali per tutte"
          curl -fsSL --max-time 30 "https://notiziebenevento.it/sitemap.xml" -o "$RUNNER_TEMP/sitemap-prima.xml" || true
          if ! python3 strumenti/pagine.py --sitemap-prima "$RUNNER_TEMP/sitemap-prima.xml" --indexnow "$RUNNER_TEMP/indexnow.json"; then
            echo "::warning::Pagine non generate: il sito funziona lo stesso (404.html apre le notizie nella prima pagina)"
          fi

      - name: Statistiche private (cifrate con la parola d'ordine)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STATISTICHE_PAROLA: ${{ secrets.STATISTICHE_PAROLA }}
          GSC_CHIAVE: ${{ secrets.GSC_CHIAVE }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          DIARIO_CHIAVE: ${{ secrets.DIARIO_CHIAVE }}
        run: |
          pip install --quiet cryptography || echo "::warning::cryptography non installato"
          if ! python3 strumenti/statistiche.py; then
            echo "::warning::Statistiche non aggiornate (il sito si pubblica lo stesso)"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Avvisa Bing delle pagine nuove (IndexNow)
        run: |
          if [ -f "$RUNNER_TEMP/indexnow.json" ]; then
            python3 strumenti/pagine.py --invia-indexnow "$RUNNER_TEMP/indexnow.json" || echo "::warning::IndexNow non ha risposto"
          fi

      # dopo la pubblicazione, così Facebook trova già online la pagina della notizia (titolo e anteprima)
      - name: Facebook (una notizia nuova sulla Pagina, se è il momento)
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_SUBITO: ${{ github.event.inputs.facebook_subito || '0' }}
        run: python3 strumenti/facebook.py || echo "::warning::Facebook non ha pubblicato (vedi l'avviso sopra)"

      - name: Instagram (una notizia ogni ora e mezza, se è il momento)
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python3 strumenti/instagram.py || echo "::warning::Instagram non ha pubblicato (vedi l'avviso sopra)"

      # Telegram: il bot non può rileggere il canale, cosa è già uscito lo ricorda un file che GitHub conserva tra
      # una pubblicazione e l'altra (cache; le pubblicazioni vanno una alla volta, vedi «concurrency» in alto)
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/social
          key: social-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: social-

      - name: Telegram (notizie nuove e aggiornamenti sul canale)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_SUBITO: ${{ github.event.inputs.telegram_subito || '0' }}
          TG_RECUPERA: ${{ github.event.inputs.telegram_recupera || '0' }}
        run: |
          mkdir -p "$RUNNER_TEMP/social"
          python3 strumenti/telegram.py --stato "$RUNNER_TEMP/social/telegram.json" || echo "::warning::Telegram non ha pubblicato (vedi l'avviso sopra)"

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ runner.temp }}/social
          key: social-${{ github.run_id }}-${{ github.run_attempt }}
