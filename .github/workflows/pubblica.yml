# Pubblica il sito su GitHub Pages: a ogni modifica (notizie nuove) e ogni ora (meteo aggiornato).
name: Pubblica il sito

on:
  push:
    branches: [main]
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:
    inputs:
      facebook_subito:
        description: "Quante notizie mettere subito sulla Pagina Facebook (0 = come sempre, una ogni 25 minuti)"
        default: "0"
      telegram_subito:
        description: "Quante delle ultime notizie mandare subito sul canale Telegram (0 = come sempre)"
        default: "0"
      telegram_recupera:
        description: "Telegram: mandare subito tutte le notizie arretrate delle ultime 12 ore (1 = sì, 0 = come sempre)"
        default: "0"
      carburanti:
        description: "Prezzi dei carburanti (li manda il Pi di casa: carburanti.json compresso e in base64). Vuoto = quelli già pubblicati"
        default: ""
      farmacie:
        description: "Turni delle farmacie di Benevento (li manda il Pi di casa: farmacie.json compresso e in base64). Vuoto = quelli già pubblicati"
        default: ""
      contributi:
        description: "Catalogo dei contributi (lo manda il Pi di casa: compresso e in base64). Vuoto = quello già pubblicato"
        default: ""
      curiosita_correggi:
        description: "Curiosità già uscita da correggere: «<slug>» cambia la foto su Telegram, «<slug> ripubblica» la rimanda anche su Facebook e Instagram se lì il post vecchio non c'è più"
        default: ""

permissions:
  contents: write   # le foto fatte con l'IA (strumenti/foto_ia.py) vanno nel repository
  pages: write
  id-token: write
  actions: read   # le statistiche leggono le pubblicazioni (puntualità dei giri)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # un passo piantato non deve tenere ferme per ore le pubblicazioni dopo (vanno una alla volta)
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Python con pip che funziona (quello di sistema di Ubuntu non lascia installare Pillow)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Nessuna notizia già uscita sparisce (lui, 28 ott 2026, dopo la notizia di Arpaia tolta da un giro: «non deve mai
      # più ricapitare»): quello che il sito mostra adesso e qui manca si rimette com'era, anche nel repository
      # (strumenti/sparite.py). Prima di tutto il resto, così le pagine, le foto e le statistiche lo vedono.
      - name: Nessuna notizia sparita
        timeout-minutes: 3
        continue-on-error: true   # se va oltre il tempo, la pubblicazione va avanti lo stesso (si riprova alla prossima)
        run: python3 strumenti/sparite.py --manda || echo "::warning::Controllo delle notizie sparite non riuscito"

      - name: Meteo da 8 modelli
        env:
          # per leggere il bollettino della Protezione civile su GitHub senza finire nel limite delle richieste anonime
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ! python3 strumenti/meteo.py; then
            echo "Meteo non aggiornato: tengo quello già pubblicato"
            curl -fsSL --max-time 30 "https://notiziebenevento.it/meteo.json" -o meteo.json || echo "nessun meteo precedente"
          fi

      # il meteo completo dei paesi (meteo.html?paese=…, strumenti/meteo.py --paesi): ogni 6 ore, 13 paesi a giro; i
      # file restano tra un giro e l'altro nella cache (se si perde, meteo.py li riprende dal sito)
      - uses: actions/cache/restore@v4
        with:
          path: meteo-paesi
          key: meteo-paesi-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: meteo-paesi-

      - name: Meteo dei paesi (a turno, ogni 6 ore)
        timeout-minutes: 6
        continue-on-error: true   # un intoppo qui non ferma la pubblicazione: restano le previsioni di prima
        run: python3 strumenti/meteo.py --paesi meteo-paesi --quanti 13 --ogni-ore 6

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: meteo-paesi
          key: meteo-paesi-${{ github.run_id }}-${{ github.run_attempt }}

      # il meteo di ogni Comune per le loro pagine (strumenti/meteo_comuni.py, Open-Meteo): se non risponde resta quello di prima
      - name: Meteo dei Comuni
        run: |
          if ! python3 strumenti/meteo_comuni.py --al-massimo-ogni 55; then
            echo "::warning::Meteo dei Comuni non aggiornato: tengo quello già pubblicato"
            curl -fsSL --max-time 30 "https://notiziebenevento.it/meteo-comuni.json" -o meteo-comuni.json || echo "nessun meteo dei Comuni precedente"
          fi

      # dove sono le strade chiuse, per i tondi della mappa (strumenti/strade_luoghi.py): ogni strada si chiede una volta
      # a OpenStreetMap e resta in strade-luoghi.json sul sito; se non risponde, la mappa mette i tondi al centro del paese
      - name: Strade chiuse sulla mappa
        timeout-minutes: 3
        continue-on-error: true
        run: python3 strumenti/strade_luoghi.py --al-massimo 15 --tempo 100

      # il sito del Ministero da GitHub non si apre: i prezzi li scarica il Pi di casa (strumenti/carburanti.py --manda)
      # e li manda qui quando sono nuovi; nelle altre pubblicazioni restano quelli già sul sito
      - name: Prezzi dei carburanti (dal Pi di casa, o quelli già pubblicati)
        env:
          CARBURANTI: ${{ github.event.inputs.carburanti }}
        run: |
          if [ -n "$CARBURANTI" ] && printf '%s' "$CARBURANTI" | base64 -d | gunzip > carburanti.nuovo \
             && python3 -c "import json; d = json.load(open('carburanti.nuovo')); assert len(d['impianti']) > 60 and d['classifiche']['benzina'] and d['estrazione']; print('carburanti: arrivati dal Pi i prezzi del', d['estrazione'])"; then
            mv carburanti.nuovo carburanti.json
          else
            rm -f carburanti.nuovo
            curl -fsSL --max-time 30 "https://notiziebenevento.it/carburanti.json" -o carburanti.json || echo "nessun prezzo pubblicato prima"
          fi

      # i turni delle farmacie (strumenti/farmacie.py --manda): li legge il Pi di casa dal PDF di Federfarma Benevento e
      # li manda qui quando cambiano; nelle altre pubblicazioni restano quelli già sul sito
      - name: Turni delle farmacie (dal Pi di casa, o quelli già pubblicati)
        env:
          FARMACIE: ${{ github.event.inputs.farmacie }}
        run: |
          if [ -n "$FARMACIE" ] && printf '%s' "$FARMACIE" | base64 -d | gunzip > farmacie.nuovo \
             && python3 -c "import json; d = json.load(open('farmacie.nuovo')); assert d['diurno'] and d['notturno'] and d['firma']; print('farmacie: arrivati dal Pi i turni', d['firma'], 'fino al', d['notturno'][-1]['al'])"; then
            mv farmacie.nuovo farmacie.json
          else
            rm -f farmacie.nuovo
            curl -fsSL --max-time 30 "https://notiziebenevento.it/farmacie.json" -o farmacie.json || echo "nessun turno pubblicato prima"
          fi

      # calendario, risultati e classifica della Serie B per la pagina calcio/ e il riquadro in prima pagina (la diretta
      # la legge poi calcio.js nel browser); se la fonte non risponde restano quelli già pubblicati
      - name: Benevento Calcio (calendario, risultati e classifica di Serie B)
        run: |
          if ! python3 strumenti/calcio.py; then
            echo "::warning::Calcio non aggiornato: tengo quello già pubblicato"
            curl -fsSL --max-time 30 "https://notiziebenevento.it/calcio.json" -o calcio.json || echo "nessun calcio pubblicato prima"
          fi

      # i contributi per il Sannio (pagina contributi/): il catalogo del Ministero da GitHub non si apre (come i carburanti),
      # lo manda il Pi di casa quando cambia (strumenti/contributi.py --scarica --manda); a ogni pubblicazione si unisce ai
      # contributi locali scritti dall'agente (contributi_locali.json) e si tolgono i scaduti. Se qualcosa non va, restano
      # quelli già pubblicati
      - name: Contributi e bandi (catalogo dal Pi di casa, più i contributi locali)
        env:
          CONTRIBUTI: ${{ github.event.inputs.contributi }}
        run: |
          rm -f contributi-catalogo.json
          if [ -n "$CONTRIBUTI" ] && printf '%s' "$CONTRIBUTI" | base64 -d | gunzip > contributi-catalogo.json; then
            echo "contributi: arrivato il catalogo dal Pi"
          else
            rm -f contributi-catalogo.json
          fi
          curl -fsSL --max-time 30 "https://notiziebenevento.it/contributi.json" -o contributi-prima.json || rm -f contributi-prima.json
          if ! python3 strumenti/contributi.py --pubblica --catalogo contributi-catalogo.json --prima contributi-prima.json; then
            echo "::warning::Contributi non aggiornati: tengo quelli già pubblicati"
            if [ -s contributi-prima.json ]; then cp contributi-prima.json contributi.json; fi
          fi
          rm -f contributi-catalogo.json contributi-prima.json

      # Le foto fatte con l'IA (strumenti/foto_ia.py): quella della curiosità del giorno quando su Commons non c'è (lui,
      # 28 ott 2026: «se non la trovi ne crei una perfetta cinematografica con gpt»), e le 31 fatte quel giorno per notizie
      # e storie che restano (--segna). Prima delle pagine, così la scheda dei social ha già la foto. Le foto nuove vanno
      # nel repository con un commit a parte; senza il segreto OPENAI_API_KEY si segnano solo quelle che ci sono già.
      - name: Foto fatte con l'IA (curiosità)
        timeout-minutes: 6
        continue-on-error: true   # come sopra: OpenAI lento non deve fermare il sito e i social
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pip install --quiet pillow || true
          python3 strumenti/foto_ia.py --genera || echo "::warning::Foto IA non fatte: si riprova alla pubblicazione dopo"
          python3 strumenti/foto_ia.py --segna || echo "::warning::Foto IA non segnate"

      # le immagini di anteprima già fatte: si rifanno solo quelle delle notizie nuove o cambiate
      - uses: actions/cache@v4
        with:
          path: |
            img/n
            img/ig
          key: anteprime-${{ hashFiles('notizie.json', 'archivio/*.json', 'strumenti/pagine.py') }}
          restore-keys: anteprime-

      - name: Pagine per Google (una per notizia), sitemap, feed e anteprime
        run: |
          pip install --quiet pillow || echo "::warning::Pillow non installato: anteprime uguali per tutte"
          curl -fsSL --max-time 30 "https://notiziebenevento.it/sitemap.xml" -o "$RUNNER_TEMP/sitemap-prima.xml" || true
          if ! python3 strumenti/pagine.py --sitemap-prima "$RUNNER_TEMP/sitemap-prima.xml" --indexnow "$RUNNER_TEMP/indexnow.json"; then
            echo "::warning::Pagine non generate: il sito funziona lo stesso (404.html apre le notizie nella prima pagina)"
          fi

      # Telegram e le chiusure: cosa è già uscito lo ricorda un file che GitHub conserva tra una pubblicazione e
      # l'altra (cache; le pubblicazioni vanno una alla volta, vedi «concurrency» in alto). Si ripristina qui, prima
      # delle statistiche, che ne mostrano le chiusure uscite sui social.
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/social
          key: social-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: social-

      # Per un comunicato del giro lampo (commit «Comunicato delle …», dal 25 ott 2026: lui «dobbiamo recuperare qualche
      # minuto») le statistiche non si rifanno se quelle pubblicate sono di meno di 20 minuti fa: una trentina di secondi
      # in meno prima che la notizia esca sul sito e sui social. Se non si possono tenere, si rifanno come sempre.
      - name: Statistiche private (cifrate con la parola d'ordine)
        env:
          EVENTO: ${{ github.event_name }}
          MESSAGGIO: ${{ github.event.head_commit.message }}
          CHIUSURE_STATO: ${{ runner.temp }}/social/chiusure.json
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STATISTICHE_PAROLA: ${{ secrets.STATISTICHE_PAROLA }}
          GSC_CHIAVE: ${{ secrets.GSC_CHIAVE }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          DIARIO_CHIAVE: ${{ secrets.DIARIO_CHIAVE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENTO" = "push" ] && printf '%s\n' "$MESSAGGIO" | head -n 1 | grep -q '^Comunicato delle ' \
             && python3 strumenti/statistiche.py --tieni-pubblicate 20; then
            exit 0
          fi
          pip install --quiet cryptography || echo "::warning::cryptography non installato"
          if ! python3 strumenti/statistiche.py; then
            echo "::warning::Statistiche non aggiornate (il sito si pubblica lo stesso)"
          fi

      # le versioni scartate dalla quarantena di archivia.py servono all'agente, non al sito
      - name: Togli i file interni
        run: rm -f diario/quarantena.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Avvisa Bing delle pagine nuove (IndexNow)
        run: |
          if [ -f "$RUNNER_TEMP/indexnow.json" ]; then
            python3 strumenti/pagine.py --invia-indexnow "$RUNNER_TEMP/indexnow.json" || echo "::warning::IndexNow non ha risposto"
          fi

      # le chiusure dei Comuni per prime e a qualsiasi ora, su Telegram (col suono), Facebook e Instagram
      # (strumenti/chiusure_social.py). Se un canale non va, il resto della pubblicazione continua, ma alla fine il
      # lavoro diventa rosso (mail al proprietario) e la sentinella rilancia la pubblicazione.
      - name: Chiusure dei Comuni sui social (a qualsiasi ora)
        id: chiusure
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/social"
          python3 strumenti/chiusure_social.py --stato "$RUNNER_TEMP/social/chiusure.json"

      # la curiosità del Sannio del giorno, alle 12 (alle 12 la pubblicazione la fa partire il Pi di casa), su Telegram,
      # Facebook e Instagram (strumenti/curiosita_social.py): dopo la pubblicazione, così foto e pagina sono già online.
      # Se un canale non va, il resto continua, ma alla fine il lavoro diventa rosso e la pubblicazione dopo riprova.
      - name: Curiosità del Sannio (alle 12, su Telegram, Facebook e Instagram)
        id: curiosita
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/social"
          python3 strumenti/curiosita_social.py --stato "$RUNNER_TEMP/social/curiosita.json"

      # una curiosità già uscita con la foto sbagliata (strumenti/curiosita_social.py --correggi; 28 ott 2026)
      - name: Curiosità da correggere (a mano)
        if: ${{ github.event.inputs.curiosita_correggi != '' }}
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CORREGGI: ${{ github.event.inputs.curiosita_correggi }}
        run: |
          set -- $CORREGGI
          if [ "${2:-}" = "ripubblica" ]; then python3 strumenti/curiosita_social.py --correggi "$1" --ripubblica
          else python3 strumenti/curiosita_social.py --correggi "$1"; fi

      # dopo la pubblicazione, così Facebook trova già online la pagina della notizia (titolo e anteprima)
      - name: Facebook (una notizia nuova sulla Pagina, se è il momento)
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_SUBITO: ${{ github.event.inputs.facebook_subito || '0' }}
        run: python3 strumenti/facebook.py --stato "$RUNNER_TEMP/social/facebook.json" || echo "::warning::Facebook non ha pubblicato (vedi l'avviso sopra)"

      - name: Instagram (le stesse notizie di Facebook, subito dopo, e il riepilogo della sera)
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/social"
          python3 strumenti/instagram.py --stato "$RUNNER_TEMP/social/instagram.json" || echo "::warning::Instagram non ha pubblicato (vedi l'avviso sopra)"

      - name: Telegram (notizie nuove e aggiornamenti sul canale)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_SUBITO: ${{ github.event.inputs.telegram_subito || '0' }}
          TG_RECUPERA: ${{ github.event.inputs.telegram_recupera || '0' }}
        run: |
          mkdir -p "$RUNNER_TEMP/social"
          python3 strumenti/telegram.py --stato "$RUNNER_TEMP/social/telegram.json" || echo "::warning::Telegram non ha pubblicato (vedi l'avviso sopra)"

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ runner.temp }}/social
          key: social-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Chiusure non uscite su tutti i canali (lavoro in rosso, mail al proprietario)
        if: steps.chiusure.outcome == 'failure'
        run: |
          echo "::error::Le chiusure dei Comuni non sono uscite su tutti i canali: vedi il passo «Chiusure dei Comuni sui social». La prossima pubblicazione riprova da sola."
          exit 1

      - name: Curiosità non uscita su tutti i canali (lavoro in rosso, mail al proprietario)
        if: steps.curiosita.outcome == 'failure'
        run: |
          echo "::error::La curiosità del Sannio non è uscita su tutti i canali: vedi il passo «Curiosità del Sannio». La prossima pubblicazione riprova da sola (fino alle 22)."
          exit 1
