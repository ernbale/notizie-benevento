# UNA VOLTA SOLA (30 ott 2026, trasloco su Aruba; da togliere subito dopo): i segreti della pubblicazione, cifrati con
# la chiave pubblica del server Aruba (la privata sta solo lì: nessun altro li può aprire), in un artefatto di un giorno
# che si porta sul server e poi si cancella. Così non li vede nessuno e non si riscrivono a mano.
name: Copia i segreti per il server Aruba (una volta sola)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  copia:
    runs-on: ubuntu-latest
    steps:
      - name: Cifra i segreti con la chiave pubblica del server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DIARIO_CHIAVE: ${{ secrets.DIARIO_CHIAVE }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GSC_CHIAVE: ${{ secrets.GSC_CHIAVE }}
          STATISTICHE_PAROLA: ${{ secrets.STATISTICHE_PAROLA }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          SERVER_PEM: |
            -----BEGIN PUBLIC KEY-----
            MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEApcburidDKebO6DwjQBux
            wvU4Vjo98tUEaZmSbuAxoKF7UvoH+TCP0mGsbGJ0M7QYmTLWZA/CP9l3ZZsdtSzG
            ulXHyRwc5pLqJvKFFLee17bFJcfxwgU0qeVTamPJ0kYGQRUb2MAbchp9D7Fvi2AM
            DImzHZUtqJo+diKxJLq3kmiwWb6IU636WsWieJErUBJgju8bXEMHvAsNN2KHNPdz
            J9+pF2fxTj/iiIQRMwq3rPwUHJtEOm93tXitWh97gIH1jsq6jsDcedm14G9BBDiu
            3TFZ0/pPlvIU2dWZdP+EAAhsA062KnFP0YNta3k2aCOMi9pEarYjUaob2PS5dmIR
            ijmMadtY4U74e7zbLUSq52/H3hURA0mk4Oo0XMoO7L8rwANR8Cd0L17rS7Uk73Qc
            T1/Js3QcQEG2IdEYww6BOfyBXOqy6PXWqEkwABrTO+zaDYYYrx3EQ1dwoxttHWPN
            U7cW1JDwkLeF5CK4cBHTNYgHd+uvHi+EX1TAsd9IJrAIytjodj0KISHqjRGY0keL
            nTwGS/Wqay41ksSfydbC+tQKcrrk1m3WAZMB1NVGL9DSFk/4MroxzNQmKz5QNByQ
            DjRYuiAtzPGfM8y2uFvNLDHMSGYq8QIYcQt+yFB/niPrLJoMf9NSKHg4h2UH5rJb
            mLgLUxcFab2Y7CPXkgz/CMsCAwEAAQ==
            -----END PUBLIC KEY-----
        run: |
          set -eu
          umask 077
          d=$(mktemp -d); o="$RUNNER_TEMP/uscita"; mkdir -p "$o"
          for n in CLOUDFLARE_API_TOKEN DIARIO_CHIAVE FB_PAGE_TOKEN GSC_CHIAVE STATISTICHE_PAROLA TELEGRAM_TOKEN; do
            printf '%s' "${!n}" > "$d/$n"
            echo "$n: $(wc -c < "$d/$n") caratteri"
          done
          printf '%s\n' "$SERVER_PEM" > "$RUNNER_TEMP/server.pem"
          openssl rand -hex 32 > "$RUNNER_TEMP/k"
          tar -C "$d" -cf - . | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass "file:$RUNNER_TEMP/k" -out "$o/segreti.enc"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/server.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$RUNNER_TEMP/k" -out "$o/chiave.enc"
          rm -rf "$d" "$RUNNER_TEMP/k"
          ls -la "$o"
      - uses: actions/upload-artifact@v4
        with:
          name: segreti-cifrati
          path: ${{ runner.temp }}/uscita
          retention-days: 1
