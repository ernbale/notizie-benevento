# La sentinella: ogni quarto d'ora controlla che giro, sito e canale Telegram stiano al passo e ripara quello che può
# (pubblicazione ferma in coda, sito indietro, canale muto). Se resta qualcosa di storto finisce in rosso e GitHub
# manda una mail. Vedi strumenti/sentinella.py.
name: Sentinella

on:
  schedule:
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:
    inputs:
      avviso:
        description: "i problemi visti dalla sentinella del Pi (la lancia lei): finiscono nella mail"
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: sentinella
  cancel-in-progress: true

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # dal trasloco su Aruba (30 ott 2026): se il server sembra fermo, WhatsApp al proprietario (CallMeBot, segreto
      # CALLMEBOT) al massimo una volta ogni 2 ore; quando l'ultimo avviso lo ricorda la cache
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sentinella
          key: sentinella-${{ github.run_id }}
          restore-keys: sentinella-
      - name: Giro, sito e Telegram al passo
        env:
          GH_TOKEN: ${{ github.token }}
          AVVISO_PI: ${{ inputs.avviso }}
          CALLMEBOT: ${{ secrets.CALLMEBOT }}
          SENTINELLA_STATO: ${{ runner.temp }}/sentinella
        run: |
          mkdir -p "$SENTINELLA_STATO"
          python3 strumenti/sentinella.py
      - uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/sentinella
          key: sentinella-${{ github.run_id }}
